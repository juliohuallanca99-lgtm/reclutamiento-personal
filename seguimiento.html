<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de ingreso de personal · Marcobre Bateas</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#16222c;--mu:#5d6b78;--ln:#d9dfe5;--ac:#f0b400;--acd:#16222c;--ok:#1d8a5a;--okb:#dcf2e7;--pe:#8a94a0;--peb:#e8ebef;--ob:#c8372d;--obb:#fbe0dd;--pr:#b87400;--prb:#fdf0cc;--sh:0 1px 2px rgba(22,34,44,.08);--oa:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--sf:#18222b;--ink:#e8edf1;--mu:#93a1ad;--ln:#2b3946;--acd:#f0b400;--oa:#16222c;--okb:#12382a;--peb:#242f39;--obb:#431b18;--prb:#3d3010;--ok:#4cc58a;--ob:#ff7a70;--pr:#f0b400}}
:root[data-theme="dark"]{--bg:#0f161c;--sf:#18222b;--ink:#e8edf1;--mu:#93a1ad;--ln:#2b3946;--acd:#f0b400;--oa:#16222c;--okb:#12382a;--peb:#242f39;--obb:#431b18;--prb:#3d3010;--ok:#4cc58a;--ob:#ff7a70;--pr:#f0b400}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px}
header{background:var(--acd);color:var(--oa);border-bottom:4px solid var(--ac);margin:0 -16px 18px;padding:18px 16px}
header .in{max-width:1240px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font:700 30px/1.05 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.3px}header p{margin:4px 0 0;opacity:.8;font-size:14px}
.tb{background:transparent;border:1px solid currentColor;border-radius:6px;padding:6px 12px;opacity:.9}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--mu)}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:6px;padding:12px 14px;box-shadow:var(--sh)}
.k b{font:700 34px/1 'Barlow Condensed',sans-serif;display:block}.k span{color:var(--mu);font-size:13px}
.k.g{border-left-color:var(--ok)}.k.o{border-left-color:var(--ob)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
h2{font:700 20px 'Barlow Condensed',sans-serif;margin:0 0 12px;letter-spacing:.3px}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{background:var(--bg);border-radius:6px;padding:10px}.col h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.chip{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:5px;padding:8px 10px;margin-bottom:6px}
.chip:hover{border-color:var(--ac)}.chip small{display:block;color:var(--mu)}
.bar{height:8px;background:var(--peb);border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ok)}
.sb{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.f{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:5px 13px;font-size:14px}
.f[aria-pressed=true]{background:var(--acd);color:var(--oa);border-color:var(--acd)}
input[type=search]{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:6px;padding:7px 10px;min-width:200px;font:inherit}
.sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:6px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap;position:sticky;top:0}tr:last-child td{border-bottom:0}
tbody tr.r:hover{background:var(--bg)}
.bd{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.pend{background:var(--peb);color:var(--mu)}.obs{background:var(--obb);color:var(--ob)}.prog{background:var(--prb);color:var(--pr)}.na{background:transparent;color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:6px 12px;font-weight:600}.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#16222c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.fc{background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--ac);border-radius:6px;padding:14px;box-shadow:var(--sh)}
.fc.L{border-top-color:var(--ok)}.fc.O{border-top-color:var(--ob)}
.av{width:42px;height:42px;border-radius:50%;background:var(--acd);color:var(--oa);display:grid;place-items:center;font:700 16px 'Barlow Condensed',sans-serif;flex:none}
.row{display:flex;gap:10px;align-items:center}.mu{color:var(--mu);font-size:13px}
.m{text-align:center;padding:7px 6px;font-size:12px;font-weight:600;border-bottom:1px solid var(--bg)}
.m.ok,.m.pend,.m.obs,.m.prog,.m.na{border-radius:0}
th.v{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:130px;padding:8px 4px}
dialog{border:0;border-radius:8px;padding:0;max-width:760px;width:calc(100% - 24px);background:var(--sf);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,16,22,.6)}
.dh{padding:18px;border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:center}
.db{padding:18px;max-height:62vh;overflow:auto}.df{padding:12px 18px;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:8px 0 18px}
.stp{border:1px solid var(--ln);border-left-width:4px;border-radius:5px;padding:7px 9px;font-size:13px}
.stp.ok{border-left-color:var(--ok)}.stp.obs{border-left-color:var(--ob)}.stp.prog{border-left-color:var(--ac)}.stp.pend,.stp.na{border-left-color:var(--pe)}
.stp b{display:block;font-size:12.5px;color:var(--mu);font-weight:500}
[hidden]{display:none!important}select,.stp input{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:3px;width:100%;margin-top:3px}.ei{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:5px 8px;width:100%;margin:2px 0}.hb{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acd);color:var(--oa);padding:8px 16px;border-radius:6px;display:none;z-index:9}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media(max-width:600px){.sb{grid-template-columns:100px 1fr 40px}h1{font-size:25px}}
@media print{header,nav,.tools,.df{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="in"><div><p>Seguimiento de ingreso de personal · Marcobre Bateas</p></div>
<div class="hb" style="align-items:center;justify-content:flex-end"><button class="tb" id="bp" type="button" hidden="">Guardando…</button><button class="tb" id="bi" type="button">Importar Excel</button><input type="file" id="fx" accept=".xlsx,.xls,.csv" hidden><div class="hb" id="hb" hidden=""><button class="tb" id="be" type="button" hidden="">Editar datos</button><button class="tb" id="bx" type="button">Descargar Excel</button><button class="tb" id="bh" type="button">Descargar página</button><button class="tb" id="bt" type="button">Descargar PowerPoint</button><button class="tb" id="th" type="button">Cambiar tema</button></div><button class="tb" id="bc" type="button" aria-expanded="false" aria-controls="hb" aria-label="Mostrar opciones" title="Opciones"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button></div></div></header>
<nav role="tablist" id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><div class="toast" id="ts" role="status"></div>
<script id="ds">const W=[],R=[];</script>
<script id="app">
const SN=['EMO','Validación JJC','Validación UME','Anexo 8','Anexo A','Aut-Rec','Fotocheck'],
TN=['Inducción Anexo 4','Prevención lesiones en manos','IPERC','Ácido sulfúrico','Sustancias químicas','Riesgos eléctricos','Sistema de izaje','Seguridad con herramientas','Trabajos en altura','Trabajos en caliente','Bloqueo de energía'];
const $=s=>document.querySelector(s),cap=s=>s.toLowerCase().replace(/(^|[\s,.])(\S)/g,(m,a,b)=>a+b.toUpperCase());
const pc=a=>a.filter(x=>x.k==='ok').length;
const calc=w=>{w.ps=pc(w.st);w.pt=pc(w.tr);w.pct=Math.round((w.ps+w.pt)/18*100);w.g=w.e==='LABORANDO'?'L':w.e==='CON LICENCIA'?'C':w.st.some(x=>x.k==='obs')?'O':'T'};W.forEach(calc);
let ed=false,dirty=false,AR=null,arm=false;const FN='Seguimiento de personal · Marcobre Bateas';
const GL={L:'Laborando',T:'En trámite',O:'Observado',C:'Con licencia'};
let sv='all';const V=()=>W.filter(w=>sv==='all'||w.s===sv);
const SL={'SERV. ALIN. DE FAJA CV 315':'Faja CV 315','SERV. CORROSION':'Corrosión','TSF - SERV. TUBERIA':'TSF · Tubería'},sl=s=>s?(SL[s]||cap(s.replace(/^SERV\.?\s*/i,''))):'Sin servicio';
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const ovd=c=>{if(!c||c.k!=='prog')return false;const m=String(c.l).match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/);return !!m&&new Date(m[3]?+m[3]:TODAY.getFullYear(),+m[2]-1,+m[1])<TODAY};
let tab='res',flt='all',q='',vw='tab',mx='st',rf='all',cur=0,ct=-1,dd=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hm=w=>w.mov&&w.mov.k==='prog';
const mvc=w=>`<div class="stp ${hm(w)?'prog':'na'}" style="grid-column:span 2"><b>🚚 Movilización · fecha probable</b>${ed?`<div class="row"><input type="date" data-mv value="${hm(w)?(w.mov.d||''):''}" aria-label="Fecha probable de movilización"><button class="btn" data-mvx type="button" style="padding:3px 8px">Quitar</button></div>`:(hm(w)?w.mov.l:'Sin fecha')}</div>`;
const bd=c=>`<span class="bd ${c.k}">${c.l}</span>`;
const ini=n=>n.split(/[\s,]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('');
const vis=()=>V().filter(w=>(flt==='all'||w.g===flt)&&(w.n+w.f+w.dni).toLowerCase().includes(q.toLowerCase()));
function nav(){const sv0=[...new Set(W.map(w=>w.s))].filter(Boolean);if(sv!=='all'&&!sv0.includes(sv))sv='all';
$('#nav').innerHTML=[['res','Resumen'],['per','Personal'],['eta','Etapas del proceso']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-t="${k}" type="button">${l}</button>`).join('')+(sv0.length>1?`<span class="sp"></span><div class="hb" role="group" aria-label="Filtrar por servicio" style="align-items:center;padding:4px 0">${[['all','Todos los servicios'],...sv0.map(s=>[s,sl(s)])].map(([k,l])=>`<button class="f" aria-pressed="${sv===k}" data-sv="${esc(k)}" type="button">${esc(l)}</button>`).join('')}</div>`:'')}
function res(){const n=g=>V().filter(w=>w.g===g).length,av=Math.round(V().reduce((a,w)=>a+w.pct,0)/(V().length||1));
const ord=['PENDIENTE','EXAMEN MEDICO','FIRMA DE ANEXO A','EN MOVILIZACION','LABORANDO','CON LICENCIA'],es=[...new Set([...ord,...V().map(w=>w.e)])].filter(e=>V().some(w=>w.e===e));
const sb=(l,v,t)=>`<div class="sb"><span>${l}</span><div class="bar"><i style="width:${v/t*100}%"></i></div><b>${v}/${t}</b></div>`;
return `<div class="kpis"><div class="k"><b>${V().length}</b><span>Personal total</span></div><div class="k g"><b>${n('L')}</b><span>Laborando</span></div>${n('C')?`<div class="k"><b>${n('C')}</b><span>Con licencia</span></div>`:''}<div class="k"><b>${n('T')}</b><span>En trámite</span></div><div class="k o"><b>${n('O')}</b><span>Con observación médica</span></div><div class="k"><b>${av}%</b><span>Avance promedio</span></div></div>
<div class="card"><h2>Dónde está cada persona hoy</h2><div class="pipe">${es.map(e=>`<div class="col"><h3>${cap(e)}<span>${V().filter(w=>w.e===e).length}</span></h3>${V().filter(w=>w.e===e).map(w=>`<button class="chip" data-f="${W.indexOf(w)}" type="button">${cap(w.n)}<small>${cap(w.f)} · ${w.pct}%</small></button>`).join('')}</div>`).join('')}</div></div>
<div class="card"><h2>Personas que completaron cada etapa</h2>${SN.map((s,i)=>sb(s,V().filter(w=>w.st[i].k==='ok').length,V().length)).join('')}</div>
<div class="card"><h2>Personas con cada capacitación aprobada</h2>${TN.map((s,i)=>sb(s,V().filter(w=>w.tr[i].k==='ok').length,V().length)).join('')}</div>`}
function ficha(w){const i=W.indexOf(w);return `<div class="fc ${w.g}"><div class="row"><div class="av">${ini(w.n)}</div><div><b>${cap(w.n)}</b><div class="mu">${cap(w.f)} · ${sl(w.s)}</div></div></div>
<div class="row" style="margin:10px 0">${bd({k:w.g==='L'?'ok':w.g==='O'?'obs':'prog',l:cap(w.e)})}<span class="mu">DNI ${w.dni}</span></div>
<div class="mu">Etapas ${w.ps}/7 · Capacitaciones ${w.pt}/11</div><div class="mu">🚚 Movilización: ${hm(w)?w.mov.l:'sin fecha'}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${w.pct}%"></i></div>
<button class="btn p" data-f="${i}" type="button">Ver ficha completa</button></div>`}
function per(){const v=vis();const fl=[['all','Todos'],['L','Laborando'],['T','En trámite'],['O','Observados'],['C','Con licencia']];
let h=`<div class="tools">${fl.map(([k,l])=>`<button class="f" aria-pressed="${flt===k}" data-fl="${k}" type="button">${l}</button>`).join('')}<input type="search" id="q" placeholder="Buscar nombre, cargo o DNI" value="${q}" aria-label="Buscar"><span class="sp"></span>
${ed?'<button class="btn p" data-add type="button">+ Agregar trabajador</button>':''}<button class="f" aria-pressed="${vw==='tab'}" data-v="tab" type="button">Tabla</button><button class="f" aria-pressed="${vw==='fic'}" data-v="fic" type="button">Fichas</button></div>`;
if(!v.length)return h+'<div class="card">Ningún trabajador coincide. Quita un filtro o cambia la búsqueda.</div>';
if(vw==='fic')return h+`<div class="grid">${v.map(ficha).join('')}</div>`;
return h+`<div class="tw"><table><thead><tr><th>#</th><th>Nombres y apellidos</th><th>Función</th><th>Estado del proceso</th><th>Etapas</th><th>Capacitaciones</th><th>Movilización</th><th></th></tr></thead><tbody>${v.map(w=>`<tr class="r"><td>${w.i}</td><td><b>${cap(w.n)}</b><div class="mu">DNI ${w.dni}</div></td><td>${cap(w.f)}<div class="mu">${sl(w.s)}</div></td><td>${bd({k:w.g==='L'?'ok':w.g==='O'?'obs':'prog',l:cap(w.e)})}</td><td><div class="bar"><i style="width:${w.ps/7*100}%"></i></div><span class="mu">${w.ps}/7</span></td><td><div class="bar"><i style="width:${w.pt/11*100}%"></i></div><span class="mu">${w.pt}/11</span></td><td>${hm(w)?w.mov.l:'<span class="mu">—</span>'}</td><td><button class="btn" data-f="${W.indexOf(w)}" type="button">Ficha</button></td></tr>`).join('')}</tbody></table></div>`}
function eta(){const L=mx==='st'?SN:TN,k=mx==='st'?'st':'tr';
const cnt=j=>V().filter(w=>w.tr[j].k==='ok').length;
const menu=dd?`<div role="menu" style="position:absolute;top:100%;left:0;z-index:5;min-width:300px;margin-top:4px;padding:4px;background:var(--sf);border:1px solid var(--ln);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)">${[-1,...TN.keys()].map(j=>`<button class="btn" role="menuitem" data-ct="${j}" type="button" style="display:flex;justify-content:space-between;gap:14px;width:100%;border:0;text-align:left;${ct===j?'background:var(--bg);':''}"><span>${j<0?'Todas (matriz completa)':TN[j]}</span><span class="mu">${j<0?'':cnt(j)+'/'+V().length}</span></button>`).join('')}</div>`:'';
const det=()=>{const j=ct,G=[['ok','Aprobado'],['prog','Programado'],['pend','Pendiente'],['obs','Observado']],g=x=>V().filter(w=>{const c=w.tr[j];return x==='pend'?(c.k==='pend'||c.k==='na'):c.k===x});
return `<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:6px"><h2 style="margin:0">${TN[j]}</h2><button class="btn" data-ct="-1" type="button">Ver matriz completa</button></div><p class="mu" style="margin-top:0">${cnt(j)} de ${V().length} personas la tienen aprobada.</p><div class="pipe">${G.map(([x,l])=>{const a=g(x);return `<div class="col"><h3><span class="bd ${x}">${l}</span><span>${a.length}</span></h3>${a.length?a.map(w=>{const c=w.tr[j];return `<button class="chip" data-f="${W.indexOf(w)}" type="button">${cap(w.n)}<small>${x==='prog'?(ovd(c)?'⚠ Vencida · ':'Fecha: ')+esc(c.l):x==='obs'&&c.c?esc(c.c):cap(w.f)}</small></button>`}).join(''):'<div class="mu">Nadie</div>'}</div>`}).join('')}</div></div>`};
const mtx=()=>`<div class="tw"><table><thead><tr><th>Trabajador</th>${L.map(s=>`<th class="v">${s}</th>`).join('')}<th>Avance</th></tr></thead><tbody>${V().map(w=>`<tr class="r"><td><button class="btn" style="border:0;padding:0;background:none;text-align:left" data-f="${W.indexOf(w)}" type="button"><b>${cap(w.n)}</b></button></td>${w[k].map(c=>`<td class="m ${c.k}" title="${esc((ovd(c)?'Fecha vencida sin resultado · ':'')+c.l+(c.c?': '+c.c:''))}">${c.k==='ok'?'✓':c.k==='na'?'—':c.k==='pend'?'·':(ovd(c)?'⚠ ':'')+c.l}</td>`).join('')}<td><b>${mx==='st'?w.ps+'/7':w.pt+'/11'}</b></td></tr>`).join('')}</tbody></table></div>`;
return `<div class="tools"><button class="f" aria-pressed="${mx==='st'}" data-m="st" type="button">Etapas de ingreso</button><div id="ddw" style="position:relative;display:inline-block"><button class="f" aria-pressed="${mx==='tr'}" aria-haspopup="menu" aria-expanded="${dd}" data-m="tr" type="button">Capacitaciones Tecsup${mx==='tr'&&ct>=0?': '+TN[ct]:''} ▾</button>${menu}</div></div>
<div class="leg"><span class="bd ok">Aprobado / listo</span><span class="bd prog">Programado (fecha)</span><span class="bd pend">Pendiente</span><span class="bd obs">Observado</span><span class="bd prog">⚠ Fecha vencida</span></div>
${mx==='tr'&&ct>=0?det():mtx()}`}
function req(){const v=R.filter(r=>rf==='all'||(rf==='c'?r.cs:!r.cs));
return `<div class="tools">${[['all','Todos'],['c','Con candidato'],['b','En búsqueda']].map(([k,l])=>`<button class="f" aria-pressed="${rf===k}" data-r="${k}" type="button">${l}</button>`).join('')}<span class="mu">${v.length} requerimientos</span></div>

/* ===================================================================
   Conexión con el sistema. Lo de arriba es la página tal cual; esto
   reemplaza el guardado del artefacto por la base de datos, y agrega
   la carga desde Excel y el PowerPoint del servidor.
   =================================================================== */

async function leerJson(r){
  const t = await r.text();
  try { return JSON.parse(t); }
  catch { console.error('respuesta no-JSON:', r.status, t.slice(0,200));
          return { error:'El servicio no está disponible en este momento.' }; }
}
const alLogin = r => { if(r.status===401){ location.href='/panel.html'; return true; } return false; };

/* ---- guardado: se agenda solo, sin botón que recordar ---- */
let reloj=null, guardando=false, pendiente=false;

function senal(txt, ver=true){
  const b=$('#bp'); if(!b) return;
  b.textContent=txt; b.hidden=!ver;
}

function agendarGuardado(){
  senal('Guardando…');
  clearTimeout(reloj);
  reloj=setTimeout(guardarYa, 700);
}

async function guardarYa(){
  clearTimeout(reloj);
  if(guardando){ pendiente=true; return; }
  const w=W[cur];
  if(!w || !w.id){ senal('', false); return; }
  guardando=true;
  try{
    const r=await fetch('/api/seguimiento',{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id:w.id, dni:w.dni, n:w.n, f:w.f, t:w.t, s:w.s,
                             e:w.e, st:w.st, tr:w.tr, mov:w.mov, obs:w.obs })
    });
    if(alLogin(r)) return;
    const d=await leerJson(r);
    if(!r.ok) throw new Error(d.error||'No se pudo guardar');
    Object.assign(w, d); calc(w);
    dirty=false; senal('Guardado'); setTimeout(()=>senal('',false), 1500);
  }catch(e){
    console.error(e); senal('Sin guardar'); toast(e.message||'No se pudo guardar');
  }finally{
    guardando=false;
    if(pendiente){ pendiente=false; agendarGuardado(); }
  }
}

/* ---- alta y baja de fichas ---------------------------------------
   La ficha nace en el servicio que esté filtrado en pantalla: si
   estás viendo «Corrosión», el nuevo trabajador entra en Corrosión.  */
async function crearFicha(){
  try{
    const r=await fetch('/api/seguimiento',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ s: sv!=='all' ? sv : '' })
    });
    if(alLogin(r)) return;
    const d=await leerJson(r);
    if(!r.ok) throw new Error(d.error||'No se pudo crear');
    W.push(d); calc(d); render(); open(W.length-1);
    toast(d.s ? 'Ficha creada en '+sl(d.s) : 'Ficha creada');
  }catch(e){ toast(e.message||'No se pudo crear la ficha'); }
}

async function eliminarFicha(){
  const w=W[cur]; if(!w||!w.id) return;
  try{
    const r=await fetch('/api/seguimiento?id='+w.id,{method:'DELETE'});
    if(alLogin(r)) return;
    if(!r.ok) throw new Error((await leerJson(r)).error||'No se pudo eliminar');
    W.splice(cur,1); $('#dlg').close(); render(); toast('Ficha eliminada');
  }catch(e){ toast(e.message||'No se pudo eliminar'); }
  arm=false;
}

/* ---- PowerPoint: lo arma el servidor, no el navegador ------------
   Respeta el servicio que tengas filtrado en ese momento.           */
async function descargarPpt(){
  const b=$('#bt'); if(b){ b.disabled=true; b.textContent='Generando…'; }
  toast('Generando PowerPoint…');
  try{
    const u='/api/seguimiento?accion=powerpoint'+(sv!=='all'?'&servicio='+encodeURIComponent(sv):'');
    const r=await fetch(u);
    if(alLogin(r)) return;
    if(!r.ok) throw new Error('No se pudo generar');
    const blob=await r.blob();
    const m=/filename="([^"]+)"/.exec(r.headers.get('Content-Disposition')||'');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=m?m[1]:FN+'.pptx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('PowerPoint descargado');
  }catch(e){ console.error(e); toast('No se pudo generar el PowerPoint'); }
  finally{ if(b){ b.disabled=false; b.textContent='Descargar PowerPoint'; } }
}

/* ---- carga desde Excel ---- */
document.addEventListener('change', async e=>{
  if(e.target.id!=='fx') return;
  const archivo=e.target.files[0];
  e.target.value='';
  if(!archivo) return;
  if(typeof XLSX==='undefined'){ toast('No se cargó el lector de Excel'); return; }

  toast('Leyendo el archivo…');
  try{
    const libro=XLSX.read(await archivo.arrayBuffer(),{type:'array'});
    const hoja=libro.Sheets[libro.SheetNames[0]];
    const filas=XLSX.utils.sheet_to_json(hoja,{header:1,raw:false,defval:''})
                      .filter(f=>Array.isArray(f)&&f.some(c=>String(c).trim()));
    if(filas.length<2){ toast('El archivo no tiene filas de datos'); return; }

    const r=await fetch('/api/seguimiento?accion=importar',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ archivo: archivo.name, filas })
    });
    if(alLogin(r)) return;
    const d=await leerJson(r);
    if(!r.ok) throw new Error(d.error||'No se pudo cargar');

    await cargar(); render();
    resumenCarga(d, archivo.name);
  }catch(err){
    console.error(err); toast(err.message||'No se pudo leer el archivo');
  }
});

/* Lo que pasó con la carga, en el mismo diálogo de siempre. */
function resumenCarga(d, nombre){
  const li = t => `<li>${esc(t)}</li>`;
  $('#dlg').innerHTML =
    `<div class="dh"><div style="flex:1"><b>Carga completada</b>
       <div class="mu">${esc(nombre)}</div></div></div>
     <div class="db">
       <div class="kpis" style="margin-bottom:14px">
         <div class="k g"><b>${d.nuevos}</b><span>Personas nuevas</span></div>
         <div class="k"><b>${d.actualizados}</b><span>Actualizadas</span></div>
         <div class="k ${d.omitidas?'o':''}"><b>${d.omitidas}</b><span>Filas omitidas</span></div>
       </div>
       ${d.columnas_no_encontradas?.length
         ? `<p><b>No encontré estas columnas</b>, así que esos campos quedaron sin dato:</p>
            <ul>${d.columnas_no_encontradas.map(li).join('')}</ul>` : ''}
       ${d.avisos?.length
         ? `<p><b>Filas que no pude cargar:</b></p><ul>${d.avisos.map(li).join('')}</ul>` : ''}
       ${!d.columnas_no_encontradas?.length && !d.avisos?.length
         ? '<p>Todas las columnas se reconocieron y no hubo filas con problemas.</p>' : ''}
     </div>
     <div class="df"><span class="sp"></span>
       <button class="btn p" id="cl" type="button">Cerrar</button></div>`;
  const dl=$('#dlg'); if(!dl.open) dl.showModal();
}

/* ---- arranque ---- */
async function cargar(){
  const r=await fetch('/api/seguimiento');
  if(alLogin(r)) return false;
  const d=await leerJson(r);
  if(!r.ok) throw new Error(d.error||'No se pudo cargar');
  W.length=0; d.forEach(x=>{ W.push(x); calc(x); });
  return true;
}

async function arrancar(){
  $('#main').innerHTML='<div class="card">Cargando el seguimiento…</div>';
  try{
    if(await cargar()===false) return;
    render();
    if(!W.length) $('#main').innerHTML =
      `<div class="card"><h2>Todavía no hay personal cargado</h2>
       <p class="mu">Usa <b>Importar Excel</b> en la parte superior para traer el cuadro
       de seguimiento, o <b>Editar datos</b> y «+ Agregar trabajador» para darlo de alta a mano.</p></div>`;
  }catch(e){
    console.error(e);
    $('#main').innerHTML=`<div class="card"><h2>No se pudo cargar</h2>
      <p class="mu">${esc(e.message||'Revisa tu conexión e inténtalo de nuevo.')}</p></div>`;
  }
}

arrancar();
