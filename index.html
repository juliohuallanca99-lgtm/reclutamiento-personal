<script>
/* Puerta de entrada de la plataforma.
   - Links de registro para el personal (/?registro=CÓDIGO, también los
     que ya se enviaron): van al formulario de registro.
   - Todo lo demás: al inicio, que es el Seguimiento (Resumen). Si no hay
     sesión, el Seguimiento manda a iniciar sesión y luego vuelve. */
(function () {
  var c = new URLSearchParams(location.search).get('registro');
  location.replace(c ? '/registro.html?registro=' + encodeURIComponent(c) : '/seguimiento.html');
})();
</script>
